name: Test build

# Run from the Actions tab (or `gh workflow run test-build.yml`) to get an installer to try on a
# real PC. Nothing is published: the installer is a private download on the run's page.
on: workflow_dispatch

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: catalog signature matches the embedded keys
        run: node tools/verify-catalog.mjs

      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2.12.4 build -- --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fps-optimizer-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
