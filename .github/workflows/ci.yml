name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: catalog.json matches games/
        run: node tools/build-catalog.mjs --check

      - name: Update hosts are allowed by the CSP
        run: node tools/check-hosts.mjs

      - name: UI syntax and update-check tests
        run: |
          node --check ui/app.js
          node --check ui/updates.js
          node --check ui/mock.js
          node --test tools/updates.test.mjs tools/catalog-crypto.test.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Includes every game file's validation. committed_catalog_is_signed fails until the
      # maintainer re-signs; the private key is not in CI. See RELEASING.md.
      - name: Engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Runs even when the engine test fails, so the log still prints the openssl commands.
      - name: catalog signature matches the embedded keys
        if: always()
        run: node tools/verify-catalog.mjs

      - name: Lint
        if: always()
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
