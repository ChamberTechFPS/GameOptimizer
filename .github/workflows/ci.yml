name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: catalog.json matches games/
        run: node tools/build-catalog.mjs --check

      - name: Update hosts are allowed by the CSP
        run: node tools/check-hosts.mjs

      - name: UI syntax and update-check tests
        run: |
          node --check ui/app.js
          node --check ui/updates.js
          node --check ui/mock.js
          node --test tools/updates.test.mjs tools/catalog-crypto.test.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Includes every game file's validation. The one historical unsigned catalog
      # snapshot is allowed here; any other unsigned change fails. See RELEASING.md.
      - name: Engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Same allowlist as the engine test. Release and test-build run this without the flag.
      - name: catalog signature matches the embedded keys
        run: node tools/verify-catalog.mjs --allow-known-unsigned

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
