name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # v1.0.0-beta.1 is a prerelease of 1.0.0
          if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - name: catalog.json matches games/
        run: node tools/build-catalog.mjs --check

      - uses: dtolnay/rust-toolchain@stable

      - name: Engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2 build

      # v1.2.3 -> a draft to review and publish by hand. v1.2.3-beta.1 -> a prerelease for testing,
      # which GitHub never marks as latest, so the app's update check ignores it.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=--draft
          [[ "$GITHUB_REF_NAME" == *-* ]] && kind=--prerelease
          gh release create "$GITHUB_REF_NAME" $kind --generate-notes --title "Chamber Game Optimizer $GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe
