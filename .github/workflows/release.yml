name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify versions match the tag
        shell: pwsh
        run: |
          $tag   = '${{ github.ref_name }}' -replace '^v', ''
          $conf  = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $lib   = (Select-String -Path engine/lib.ps1 -Pattern '\$AppVersion\s*=\s*''([0-9.]+)''').Matches[0].Groups[1].Value
          $cargo = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $conf -or $tag -ne $lib -or $tag -ne $cargo) {
            throw "Version mismatch: tag=$tag tauri.conf.json=$conf lib.ps1=$lib Cargo.toml=$cargo"
          }
          Write-Host "All versions are $tag"

      - name: Verify catalog signature
        shell: pwsh
        run: |
          $env:CHAMBER_DATA_DIR = $env:TEMP
          . ./engine/lib.ps1
          $bytes = [IO.File]::ReadAllBytes('catalog.json')
          $sig   = [IO.File]::ReadAllBytes('catalog.json.sig')
          if (-not (Test-CatalogSignature $bytes $sig)) {
            throw 'catalog.json.sig does not match catalog.json — re-run tools/Sign-Catalog.ps1 before tagging'
          }
          Write-Host 'signature OK'

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build installer and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'Chamber Game Optimizer ${{ github.ref_name }}'
          releaseDraft: true

      - name: Attach config bundle to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path games, catalog.json, catalog.json.sig -DestinationPath configs.zip
          gh release upload '${{ github.ref_name }}' configs.zip catalog.json catalog.json.sig --clobber
