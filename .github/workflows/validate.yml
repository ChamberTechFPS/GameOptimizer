name: Validate

on: [push, pull_request]

jobs:
  content:
    name: Manifests + catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ajv
        run: npm install -g ajv-cli
      - name: Validate game manifests against schema
        run: |
          for m in games/*/manifest.json; do
            echo "Validating $m"
            ajv validate -s schema/manifest.schema.json -d "$m" --strict=false
          done
      - name: Validate catalog against schema
        run: ajv validate -s schema/catalog.schema.json -d catalog.json --strict=false
      - name: Cross-check manifests, templates, and variables
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys

          ENGINE_VARS = {'refreshRate', 'resolutionWidth', 'resolutionHeight'}
          errors = []
          for mpath in sorted(glob.glob('games/*/manifest.json')):
              d = os.path.dirname(mpath)
              m = json.load(open(mpath))
              declared = set(m.get('variables', []))
              for v in declared - ENGINE_VARS:
                  errors.append(f"{mpath}: variable '{v}' is not produced by the engine")
              placeholders = set()
              for t in m.get('targets', []):
                  tpl = os.path.join(d, t['template'])
                  if not os.path.isfile(tpl):
                      errors.append(f"{mpath}: template does not exist: {tpl}")
                      continue
                  placeholders |= set(re.findall(r'\{\{(\w+)\}\}', open(tpl).read()))
              for v in placeholders - declared:
                  errors.append(f"{d}: template uses {{{{{v}}}}} but manifest doesn't declare it")
              for v in declared - placeholders:
                  errors.append(f"{d}: manifest declares '{v}' but no template uses it")
              if os.path.basename(d) != m['slug']:
                  errors.append(f"{mpath}: slug '{m['slug']}' doesn't match folder name")
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('manifests OK')
          EOF
      - name: Check catalog hashes are fresh
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, sys

          cat = json.load(open('catalog.json'))
          errors = []
          for g in cat['games']:
              d = os.path.join('games', g['slug'])
              if not os.path.isdir(d):
                  errors.append(f"missing folder {d}")
                  continue
              for f in g['files']:
                  p = os.path.join(d, f['name'])
                  if not os.path.isfile(p):
                      errors.append(f"catalog lists missing file {p}")
                      continue
                  actual = hashlib.sha256(open(p, 'rb').read()).hexdigest().upper()
                  if actual != f['sha256']:
                      errors.append(f"stale hash for {p} — run tools/Update-CatalogHashes.ps1 and re-sign")
              # every game dir file should be listed so updates ship everything
              listed = {f['name'] for f in g['files']}
              on_disk = {n for n in os.listdir(d) if os.path.isfile(os.path.join(d, n))}
              for missing in on_disk - listed:
                  errors.append(f"{d}/{missing} exists but is not in catalog files[]")
          catalog_slugs = {g['slug'] for g in cat['games']}
          for d in sorted(os.listdir('games')):
              if os.path.isdir(os.path.join('games', d)) and d not in catalog_slugs:
                  errors.append(f"games/{d} exists but is not in the catalog")
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('catalog OK')
          EOF
      - name: Check catalog signature matches
        shell: pwsh
        run: |
          $env:CHAMBER_DATA_DIR = [IO.Path]::GetTempPath()
          . ./engine/lib.ps1
          $bytes = [IO.File]::ReadAllBytes('catalog.json')
          $sig   = [IO.File]::ReadAllBytes('catalog.json.sig')
          if (-not (Test-CatalogSignature $bytes $sig)) {
            throw 'catalog.json.sig does not match catalog.json — re-run tools/Sign-Catalog.ps1'
          }
          Write-Host 'signature OK'

  engine:
    name: Engine tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Invoke-Pester -Path engine/tests -CI
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $findings = foreach ($p in 'engine', 'tools') {
            Invoke-ScriptAnalyzer -Path $p -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($findings) { $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize; exit 1 }
          Write-Host 'analyzer clean'

  rust:
    name: Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: app/src-tauri
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
