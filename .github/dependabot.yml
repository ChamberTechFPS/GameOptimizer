# The workflows pin actions to commits and the build uses Cargo.lock as committed. These PRs are
# how those pins move: read the diff, let CI run, then merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
