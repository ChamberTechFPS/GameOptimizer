[package]
name = "chamber-game-optimizer"
version = "1.0.0-beta.3"
description = "ChamberTech competitive settings for your games, applied in one click"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
